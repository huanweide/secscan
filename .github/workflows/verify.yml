name: verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 单测（含扩展名污染回归 + dogfood 归零）
        run: node --test test.js

      - name: 端到端冒烟（不得静默漏扫铁律 + 退出码契约）
        run: node scripts/smoke-cli.js

      - name: dogfood（扫描自身必须归零）
        run: node index.js --fail-on-high .